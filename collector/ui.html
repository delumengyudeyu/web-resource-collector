<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebCollector · 资源采集</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#162234;font:15px system-ui,"Microsoft YaHei",sans-serif}header{background:#132b40;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}header small{color:#a9d6e6}main{max-width:1250px;margin:28px auto;padding:0 24px}.grid{display:grid;grid-template-columns:380px 1fr;gap:24px}.card{background:white;border:1px solid #dde3eb;border-radius:12px;padding:22px;margin-bottom:20px}h1{margin:0;font-size:23px}h2{font-size:18px;margin-top:0}label{display:block;margin:12px 0 6px}textarea,input,select,button{font:inherit}textarea,input[type=number],input[type=text]{width:100%;padding:10px;border:1px solid #bbc9d3;border-radius:6px}textarea{height:138px;resize:vertical}button{padding:9px 14px;border:0;border-radius:6px;background:#0a716d;color:white;cursor:pointer}button.secondary{background:#e9eef3;color:#253b4e}.row{display:flex;gap:12px}.row>div{flex:1}.hint{color:#65778a;font-size:13px;line-height:1.7}.job{padding:12px 0;border-bottom:1px solid #e5eaf0;cursor:pointer;overflow-wrap:anywhere}.job:hover{background:#f6fafc}.badge{display:inline-block;padding:3px 8px;background:#edf3f7;border-radius:5px;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid #e7edf2;vertical-align:top;word-break:break-word}a{color:#087a77}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:240px;overflow:auto}.table-wrap{overflow:auto}td:last-child,th:last-child{min-width:90px}.name{max-width:330px}.error{color:#ab3545}details{margin-top:14px}@media(max-width:850px){.grid{grid-template-columns:1fr}header{padding:20px}main{padding:0 12px}.card{padding:15px}}</style>
<header><div><h1>WebCollector</h1><small>跨网站信息与原始资源采集 · 本地工作台</small></div><a href="/docs" style="color:#c1e9eb">API 文档 ↗</a></header>
<main><div class="grid"><section><div class="card"><h2>新建采集任务</h2><label>网址 · 每行一个</label><textarea id="urls" placeholder="https://example.com/page"></textarea><div class="row"><div><label>递归深度</label><input id="depth" type="number" value="0" min="0" max="10"></div><div><label>最多页面</label><input id="pages" type="number" value="10" min="1" max="1000"></div></div><div class="row"><div><label>最多资源</label><input id="resources" type="number" value="100" min="1" max="5000"></div><div><label>总量上限 MB</label><input id="total" type="number" value="500" min="1" max="10000"></div></div><label><input id="browser" type="checkbox"> 渲染动态页面与滚动加载</label><label><input id="media" type="checkbox"> 提取音视频（下载低清原内容）</label><label><input id="gallery" type="checkbox"> 图片站专用提取器</label><details><summary>更多选项</summary><label>文件上限 MB</label><input id="filemax" type="number" value="100"><label>下载按钮 CSS 选择器 · 每行一个</label><textarea id="selectors" style="height:65px"></textarea><label>本地登录配置名称</label><input id="profile" type="text" placeholder="不需要登录时留空"><label><input id="assets" type="checkbox"> 包含脚本、样式及字体</label></details><p class="hint">下载原文件与提取正文分别记录。没有解析器的文件仍可保存。递归默认限于输入网址的域名；资源文件可来自 CDN。</p><button id="submit">开始采集</button><p id="notice" class="error"></p></div><div class="card"><h2>任务列表</h2><div id="jobs"></div></div></section><section><div class="card"><h2 id="title">采集结果</h2><p id="summary" class="hint">提交一个网址，或从左侧选择已有任务。</p><div class="row"><button class="secondary" id="cancel">取消任务</button><button class="secondary" id="retry">重新采集</button><button class="secondary" id="export">导出清单</button></div><p class="hint">发现 → 下载 → 提取 → 整理：四个阶段独立记录；本版不自动进行教学分类。</p><label>显示 <select id="filter"><option value="saved">已保存的资源</option><option value="all">全部发现记录</option><option value="failed">失败与受限项</option></select></label><div class="table-wrap"><table><thead><tr><th>资源 / 来源</th><th>状态</th><th>文件</th></tr></thead><tbody id="results"></tbody></table></div><details><summary>任务事件</summary><pre id="events"></pre></details></div></section></div></main>
<script>
const $=id=>document.getElementById(id);let selected=null,manifest=null;const states={queued:'排队',running:'采集中',completed:'完成',completed_with_errors:'完成（有失败项）',failed:'失败',cancelled:'已取消',interrupted:'已中断',downloaded:'已下载',extracted:'已提取',discovered:'已发现',skipped:'跳过',limited:'达到上限',fetching:'下载中'};
function el(tag,text){let e=document.createElement(tag);e.textContent=text;return e}
async function api(url,opts){let r=await fetch(url,opts);let d=await r.json();if(!r.ok)throw new Error(JSON.stringify(d.detail||d));return d}
async function refresh(){try{let jobs=await api('/api/jobs');$('jobs').replaceChildren();for(let j of jobs){let d=el('div',(states[j.status]||j.status)+' · '+j.spec.urls[0]);d.className='job';d.onclick=()=>{selected=j.id;refresh()};$('jobs').append(d)}if(!selected)return;let j=await api('/api/jobs/'+selected);manifest=await api('/api/jobs/'+selected+'/results');$('title').textContent=states[j.status]||j.status;$('summary').textContent=`任务 ${j.id.slice(0,8)} · ${j.pages} 个网页 · ${(j.bytes/1048576).toFixed(2)} MB · ${manifest.items.length} 条发现记录`;$('events').textContent=j.events.map(e=>e.time+' '+e.message).join('\n');$('results').replaceChildren();for(let i of manifest.items.filter(i=>$("filter").value==="all"||($("filter").value==="saved"?i.downloaded:["failed","limited","interrupted"].includes(i.status)))){let tr=el('tr',''),name=el('td',i.filename||i.title||i.label||i.url);name.className='name';let a=el('a','来源 ↗');a.href=i.source_pages[0]||i.url;a.target='_blank';a.rel='noreferrer';name.append(el('br',''),a);let status=el('td',(i.downloaded?'下载 ✓':'下载 —')+' / '+(i.extracted?'提取 ✓':'提取 —'));status.append(el('br',''),el('small',i.error||states[i.status]||i.status));let files=el('td','');if(i.downloaded){let a=el('a','下载原件');a.href='/api/files/'+i.id;files.append(a)}if(i.extracted){let a=el('a','正文');a.href='/api/files/'+i.id+'?text=true';files.append(el('br',''),a)}tr.append(name,status,files);$('results').append(tr)}}catch(e){$('notice').textContent=e.message}}
$('submit').onclick=async()=>{try{$('submit').disabled=true;$('notice').textContent='';let d={urls:$('urls').value.split('\n').map(x=>x.trim()).filter(Boolean),max_depth:+$('depth').value,max_pages:+$('pages').value,max_resources:+$('resources').value,max_total_mb:+$('total').value,max_file_mb:+$('filemax').value,browser:$('browser').checked,media:$('media').checked,gallery:$('gallery').checked,include_assets:$('assets').checked,profile:$('profile').value||null,download_selectors:$('selectors').value.split('\n').filter(Boolean)};let j=await api('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});selected=j.id;await refresh()}catch(e){$('notice').textContent=e.message}finally{$('submit').disabled=false}};
for(let action of ['cancel','retry'])$(action).onclick=async()=>{if(selected){let j=await api('/api/jobs/'+selected+'/'+action,{method:'POST'});selected=j.id;refresh()}};
$('export').onclick=()=>{if(manifest){let a=document.createElement('a');let url=URL.createObjectURL(new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'}));a.href=url;a.download='manifest.json';a.click();URL.revokeObjectURL(url)}};$("filter").onchange=refresh;refresh();setInterval(refresh,3000);
</script></html>
