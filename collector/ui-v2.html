<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebCollector</title><style>
:root{--ink:#26382f;--muted:#6b776e;--line:#dce1d9;--accent:#286148;--bg:#f5f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink)}button:hover{background:#eaf0e7}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:white;border-color:var(--accent)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}header{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 28px}header strong{font-size:20px;letter-spacing:-.5px}header small{color:var(--muted)}.spacer{flex:1}.shell{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:calc(100vh - 64px)}nav{padding:24px 12px;background:#eef1e9;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;border:0;background:none;margin-bottom:6px;padding:11px 14px}nav .active{background:white;color:var(--accent);font-weight:600}main{min-width:0;padding:28px 32px;max-width:1600px}h1{font-size:25px;font-weight:600;letter-spacing:-.5px;margin:0 0 6px}h2{font-size:16px;font-weight:600;margin:0 0 16px}p{margin:6px 0 20px}.muted,small{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:5px;padding:22px;margin-bottom:20px}.form{max-width:920px}label{display:block;margin:10px 0 5px;font-size:13px}input:not([type=checkbox]),select,textarea{border:1px solid #cbd2c7;background:white;color:var(--ink);border-radius:4px;padding:8px 10px;width:100%;min-width:0}textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 20px}.checks,.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:16px 0}.checks label{margin:0}input[type=checkbox]{accent-color:var(--accent)}details{border-top:1px solid var(--line);padding-top:14px;margin-top:18px}summary{cursor:pointer;margin-bottom:12px}.toolbar input{max-width:330px}.toolbar select{max-width:210px}.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:20px}.table{overflow:auto;border:1px solid var(--line);background:white;border-radius:5px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 13px;text-align:left;border-bottom:1px solid #e8ece4;vertical-align:top}th{background:#f7f9f4;color:var(--muted);font-size:12px;white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbf7}.name{max-width:410px;overflow-wrap:anywhere}.badge{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:2px 6px;display:inline-block}.task{padding:13px;border-bottom:1px solid var(--line);cursor:pointer;overflow-wrap:anywhere}.task.active{background:#eaf1e5;border-left:3px solid var(--accent)}.task strong{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task small{font-size:11px}.empty{padding:40px 20px;text-align:center;color:var(--muted)}.error{font-size:12px;color:#a64836;max-width:400px;overflow-wrap:anywhere}.good{color:var(--accent)}pre{font:12px/1.7 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:230px;overflow:auto}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:90vw;background:#26382f;color:white;padding:12px 20px;border-radius:5px;z-index:20;white-space:pre-wrap}.notice[hidden],[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:6px;padding:24px;width:min(1150px,94vw);max-height:92vh;color:var(--ink)}dialog::backdrop{background:#18241d66}.dialoghead{display:flex;gap:20px;align-items:start}.dialoghead h2{flex:1;overflow-wrap:anywhere}.preview img{max-width:100%;max-height:400px}.preview video,.preview audio{max-width:100%;width:100%}.preview iframe{width:100%;height:450px;border:1px solid var(--line)}.reader{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.reader>div{padding:14px;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.reader>div:nth-child(even){background:#f5f8f1;border-left:1px solid var(--line)}.reader.single{grid-template-columns:1fr}.process{border-bottom:1px solid var(--line);padding:8px 0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(max-width:1050px){.split,.settings{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:640px){header{padding:0 14px;gap:12px}header small{display:none}.shell{display:block}nav{display:flex;padding:8px;border-right:0;border-bottom:1px solid var(--line);overflow:auto}nav button{white-space:nowrap;width:auto;margin:0;padding:8px 11px}main{padding:20px 12px}.panel{padding:16px}.grid,.reader{grid-template-columns:1fr}.name{min-width:180px}dialog{padding:16px}}
</style></head><body><header><strong>WebCollector</strong><small data-t="local"></small><span class="spacer"></span><a href="/docs" target="_blank" data-t="api"></a><select id="language" style="width:100px" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></header><div class="shell"><nav><button data-page="new" data-t="new" class="active"></button><button data-page="tasks" data-t="tasks"></button><button data-page="library" data-t="library"></button><button data-page="settings" data-t="settings"></button></nav><main>

<section id="library" hidden><h1 data-t="library"></h1><p class="muted" data-t="librarynote"></p><form id="searchForm" class="toolbar"><input id="search" data-p="search" aria-label="Search"><select id="kind"><option value="" data-t="alltypes"></option><option value="pdf">PDF</option><option value="presentationml">PPTX</option><option value="image/" data-t="images"></option><option value="video/" data-t="video"></option><option value="audio/" data-t="audio"></option><option value="text/" data-t="text"></option></select><select id="filter"><option value="downloaded" data-t="saved"></option><option value="" data-t="all"></option><option value="failed" data-t="failed"></option></select><button data-t="searchbutton"></button><small id="count"></small></form><div id="libraryresults"></div><div class="toolbar"><button id="prev" data-t="prev"></button><button id="next" data-t="next"></button></div></section>
<section id="settings" hidden><h1 data-t="settings"></h1><p class="muted" data-t="settingsnote"></p><div class="settings"><div class="panel"><h2 data-t="proxytitle"></h2><p class="muted" data-t="proxynote"></p><div id="proxies"></div><form id="proxyForm"><label for="proxyid" data-t="proxyid"></label><input id="proxyid" required pattern="[a-zA-Z0-9_-]{1,60}" placeholder="my-proxy"><label for="proxyurl" data-t="proxyurl"></label><input id="proxyurl" type="password" required autocomplete="off" placeholder="http://127.0.0.1:7897"><div class="toolbar"><button data-t="saveproxy"></button></div></form><p id="proxycheck"></p></div><div class="panel"><h2 data-t="processingtitle"></h2><div id="capabilities"></div><p class="muted" data-t="qualitynote"></p><p class="muted" data-t="modelnote"></p></div><div class="panel"><h2 data-t="profiles"></h2><p class="muted" data-t="loginnote"></p><div id="profilesList"></div><form id="loginForm"><label for="loginname" data-t="profilename"></label><input id="loginname" required pattern="[a-zA-Z0-9_-]{1,60}"><label for="loginurl" data-t="loginurl"></label><input id="loginurl" type="url" required placeholder="https://example.com/login"><p class="muted" data-t="loginproxy"></p><div class="toolbar"><button data-t="openlogin"></button><button type="button" id="saveLogin" data-t="savelogin"></button><button type="button" id="cancelLogin" data-t="close"></button></div></form></div><div class="panel"><h2 data-t="storage"></h2><p id="used"></p><form id="settingsForm"><label for="storageLimit" data-t="storagelimit"></label><input id="storageLimit" type="number" min="500" max="1000000"><div class="checks"><label><input id="defaultstrict" type="checkbox"> <span data-t="defaultstrict"></span></label></div><button data-t="save"></button></form><p class="muted" style="margin-top:20px" data-t="backupnote"></p></div></div></section>
</main></div><div id="notice" class="notice" hidden role="status"></div><dialog id="viewer"><div class="dialoghead"><h2 id="filename"></h2><button id="closeViewer" data-t="close"></button></div><div class="toolbar"><a id="original" data-t="original"></a><a id="source" target="_blank" rel="noreferrer" data-t="source"></a><small id="fileinfo"></small></div><div id="preview" class="preview"></div><form id="tagForm" class="toolbar"><input id="tags" data-p="tags"><button data-t="savetags"></button></form><details open><summary data-t="contenttools"></summary><div class="toolbar"><select id="action"><option value="extract" data-t="extract"></option><option value="ocr">OCR</option><option value="transcribe" data-t="transcribe"></option><option value="translate" data-t="translate"></option></select><select id="sourceLang"><option value="zh" data-t="chinese"></option><option value="en" data-t="english"></option></select><span>→</span><select id="targetLang"><option value="en" data-t="english"></option><option value="zh" data-t="chinese"></option></select><select id="processSource" aria-label="Source processing result"></select><button id="runProcess" class="primary" data-t="process"></button></div><p class="muted" data-t="processnote"></p><div id="processes"></div></details><div class="toolbar"><select id="readmode"><option value="bilingual" data-t="bilingual"></option><option value="original" data-t="originaltext"></option><option value="translated" data-t="translated"></option></select><small data-t="review"></small></div><div id="reader"></div></dialog>

const words={local:['本地工作台 · 0.2','LOCAL WORKSPACE · 0.2'],api:['API 文档','API docs'],new:['新建采集','New capture'],tasks:['任务管理','Capture jobs'],library:['资源库','Library'],settings:['设置','Settings'],newtitle:['从一个网址开始','Start with a URL'],intro:['保存原始资源，再按需提取、翻译与整理。','Save originals. Extract, translate and organise when needed.'],urls:['网址 · 每行一个','URLs · one per line'],browser:['动态页面','Render JavaScript'],media:['音视频提取','Audio / video'],gallery:['图片站适配器','Gallery adapter'],depth:['递归深度','Crawl depth'],pages:['页面上限','Page limit'],total:['任务上限 / MB','Job limit / MB'],network:['网络模式','Network mode'],strict:['严格代理 · 禁止直连回退','Strict proxy · no direct fallback'],system:['系统环境 · 隐私未验证','System environment · privacy unverified'],direct:['直接连接','Direct connection'],proxy:['代理配置','Proxy configuration'],profile:['授权会话','Login profile'],networknote:['严格模式需要可用代理；这是应用级代理，目标网站仍能看到最终出口。','Strict mode requires a working proxy. This is application-level proxying; destinations see the final exit.'],advanced:['范围与下载设置','Scope and download settings'],resources:['资源上限','Resource limit'],filemax:['单文件上限 / MB','Per-file limit / MB'],concurrency:['并发数','Concurrency'],interval:['请求间隔 / 秒','Request interval / sec'],domains:['允许域名 · 逗号分隔','Allowed domains · comma separated'],prefix:['路径前缀','Path prefix'],selectors:['下载按钮 CSS 选择器 · 每行一个','Download button CSS selectors · one per line'],assets:['包含样式、脚本及字体','Include CSS, scripts and fonts'],best:['最佳可用音视频质量','Best available media quality'],start:['开始采集','Start capture'],tasknote:['成功、部分成功与失败分别记录。','Complete, partial and failed results are recorded separately.'],selecttask:['选择一个任务','Select a job'],cancel:['取消','Cancel'],retry:['重新执行','Retry as new job'],export:['导出清单','Export manifest'],events:['技术事件记录','Technical event log'],librarynote:['原件、来源和派生内容集中查看。','Browse originals, sources and derived content together.'],search:['搜索文件、标题、来源或标签','Search files, titles, sources or tags'],alltypes:['全部类型','All types'],images:['图片','Images'],video:['视频','Video'],audio:['音频','Audio'],text:['文本','Text'],saved:['已下载','Downloaded'],all:['全部发现','All discoveries'],failed:['失败 / 受限','Failed / limited'],searchbutton:['搜索','Search'],prev:['上一页','Previous'],next:['下一页','Next'],settingsnote:['配置保存在本机，不随源代码上传。','Configuration stays local and is excluded from source uploads.'],proxytitle:['网络出口','Network exit'],proxynote:['使用 HTTP CONNECT 代理的数字 IP 与端口。凭据不回显。严格模式阻止未经验证的 gallery-dl 子进程，不提供操作系统级断网保护。','Use an HTTP CONNECT proxy with a numeric IP and port. Credentials are never returned. Strict mode blocks unverified gallery-dl subprocesses and is not an OS kill switch.'],proxyid:['配置名称','Configuration name'],proxyurl:['代理地址 · 可含用户名密码','Proxy URL · may contain credentials'],saveproxy:['保存代理','Save proxy'],processingtitle:['本地内容处理','Local content processing'],qualitynote:['机器输出需复核，尤其是拼音、人名、数字和公式。原件不会被覆盖。','Review machine output, especially pinyin, names, numbers and formulas. Originals are never overwritten.'],modelnote:['不调用外部翻译 API。语音使用轻量模型，准确性有限。','No external translation API. Speech uses a compact model with limited accuracy.'],profiles:['授权会话','Authorised sessions'],loginnote:['在独立浏览器中手动登录后保存，不读取日常浏览器的 Cookie。','Log in yourself in an isolated browser. Everyday browser cookies are not imported.'],profilename:['会话名称','Profile name'],loginurl:['登录页面','Login URL'],loginproxy:['使用新建采集中的网络模式和代理；严格会话绑定该出口。','Uses the network mode and proxy in New capture. Strict sessions are pinned to that endpoint.'],openlogin:['打开登录窗口','Open login window'],savelogin:['保存并关闭','Save session and close'],close:['关闭','Close'],storage:['存储与默认值','Storage and defaults'],storagelimit:['总存储上限 / MB','Total storage limit / MB'],defaultstrict:['新任务默认使用严格代理','Default new jobs to strict proxy'],save:['保存','Save'],backupnote:['数据位于 D:\\WebCollector\\data。备份与恢复步骤见项目文档。','Data: D:\\WebCollector\\data. See project docs for backup and recovery.'],original:['下载原件','Download original'],source:['来源页面 ↗','Source page ↗'],tags:['标签 · 逗号分隔','Tags · comma separated'],savetags:['保存标签','Save tags'],contenttools:['提取与翻译','Extract and translate'],extract:['提取文字','Extract text'],transcribe:['语音识别','Transcribe'],translate:['翻译','Translate'],chinese:['中文','Chinese'],english:['英文','English'],process:['开始处理','Process'],processnote:['扫描件先 OCR，视频先转写；翻译可选择已有处理结果。默认最多 100 页 / 60 分钟，超出标记为部分结果；API 可调整。','OCR scans or transcribe video first, then select the result to translate. Default: 100 pages / 60 minutes; excess is marked partial. API limits are configurable.'],bilingual:['双语对照','Side by side'],originaltext:['原文','Original text'],translated:['译文','Translation'],review:['机器生成 · 需要复核','Machine generated · review required'],none:['不使用','None'],pool:['自动选择配置代理','Select from configured pool'],empty:['暂无记录','No records yet'],name:['资源','Resource'],stages:['处理阶段','Stages'],size:['大小','Size'],actions:['操作','Actions'],view:['查看','View'],discovered:['发现','Found'],downloaded:['下载','Saved'],extracted:['提取','Extracted'],classified:['整理','Tagged'],queued:['排队','Queued'],running:['运行中','Running'],completed:['完成','Complete'],completed_with_errors:['部分成功','With errors'],cancelled:['已取消','Cancelled'],interrupted:['已中断','Interrupted'],limited:['达到限制','Limited'],fetching:['下载中','Downloading'],skipped:['已跳过','Skipped'],partial:['部分结果','Partial result'],check:['检测','Check'],remove:['移除','Remove'],ready:['已安装','Installed'],missing:['未安装','Not installed'],success:['已保存','Saved'],error:['操作失败；技术信息：','Operation failed; technical detail:'],reachable:['代理请求成功；未验证 OS 级隔离','Proxy request succeeded; OS isolation unverified'],unreachable:['代理不可用；不会直连回退','Proxy unavailable; no direct fallback'],rawsource:['原件文字层','Original text layer'],output:['查看结果','View output'],saved_not_verified:['已保存；登录有效性未验证','Saved; login validity unverified'],possibly_expired:['Cookie 可能已过期','Cookies may have expired'],page:['页','Page'],records:['条资源','resources'],loading:['加载中…','Loading…'],submitted:['任务已提交','Job submitted'],blocked:['请先在设置中添加代理配置。','Add a proxy configuration in Settings first.']};
const $=id=>document.getElementById(id);let lang=localStorage.getItem('wc-language')||'zh',page='new',selected=null,manifest=null,config=null,offset=0,current=null,processes=[],readData=null,refreshing=false;const t=k=>words[k]?.[lang==='zh'?0:1]||k;
function el(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function opt(v,text){let e=el('option',text);e.value=v;return e}function button(text,fn){let e=el('button',text);e.type='button';e.onclick=guard(fn);return e}function link(text,url){let e=el('a',text);e.href=url;return e}function notify(text){$('notice').textContent=text;$('notice').hidden=false;clearTimeout(window.nt);window.nt=setTimeout(()=>$('notice').hidden=true,9000)}const guard=fn=>async e=>{e?.preventDefault();try{await fn(e)}catch(err){notify(t('error')+' '+err.message)}};async function api(url,opts){let r=await fetch(url,opts),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail||d));return d}const send=(url,body,method='POST')=>api(url,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const size=n=>n==null?'—':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';const stamp=s=>new Date(s).toLocaleString(lang==='zh'?'zh-CN':'en-US');

function language(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));$('language').value=lang;if(config)settings();refresh();if(current){renderProcesses();reader()}}function nav(p){page=p;for(let id of ['new','tasks','library','settings'])$(id).hidden=id!==p;document.querySelectorAll('[data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===p));refresh()}document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>nav(e.dataset.page));$('language').onchange=()=>{lang=$('language').value;localStorage.setItem('wc-language',lang);language()};
function table(items){if(!items.length)return el('div',t('empty'),'panel empty');let wrap=el('div',undefined,'table'),tbl=el('table'),head=el('thead'),tr=el('tr'),body=el('tbody');for(let k of ['name','stages','size','actions'])tr.append(el('th',t(k)));head.append(tr);for(let i of items){let row=el('tr'),name=el('td',i.filename||i.title||i.label||i.url,'name'),state=el('td'),actions=el('td');name.append(el('div',(i.content_type||'')+(i.tags?.length?' · '+i.tags.join(', '):''),'muted'));state.append(el('small',['discovered','downloaded','extracted','classified'].map(k=>t(k)+(i[k]?' ✓':' —')).join(' · ')),el('br'),el('span',t(i.status),'badge'));if(i.error)state.append(el('div',i.error,'error'));actions.append(button(t('view'),()=>show(i)));row.append(name,state,el('td',size(i.size)),actions);body.append(row)}tbl.append(head,body);wrap.append(tbl);return wrap}
async function tasks(){let jobs=await api('/api/jobs');$('jobs').replaceChildren();if(!jobs.length)$('jobs').append(el('div',t('empty'),'empty'));for(let j of jobs){let d=el('div',undefined,'task'+(selected===j.id?' active':''));d.tabIndex=0;d.setAttribute('role','button');d.append(el('strong',j.spec.urls[0]),el('small',t(j.status)+' · '+stamp(j.created_at)));d.onclick=guard(async()=>{selected=j.id;await tasks()});d.onkeydown=e=>{if(e.key==='Enter')d.click()};$('jobs').append(d)}if(!selected)return;let j=await api('/api/jobs/'+selected);manifest=await api('/api/jobs/'+selected+'/results');$('jobtitle').textContent=t(j.status)+' · '+j.id.slice(0,8);$('stats').textContent=j.pages+' '+t('pages')+' · '+size(j.bytes)+' · '+manifest.items.filter(i=>i.downloaded).length+' '+t('saved');$('events').textContent=j.events.map(e=>stamp(e.time)+'  '+e.message).join('\n');$('jobnetwork').textContent=t(j.spec.network_mode||'system')+(j.network?.proxy_id?' · '+j.network.proxy_id:'');$('cancel').disabled=!['running','queued'].includes(j.status);$('retry').disabled=['running','queued'].includes(j.status);$('jobresults').replaceChildren(table(manifest.items))}
async function library(){let d=await api('/api/library?'+new URLSearchParams({q:$('search').value,kind:$('kind').value,status:$('filter').value,offset,limit:50}));$('count').textContent=d.total+' '+t('records');$('libraryresults').replaceChildren(table(d.items));$('prev').disabled=offset===0;$('next').disabled=offset+50>=d.total}
async function refresh(){if(refreshing)return;refreshing=true;try{if(page==='tasks')await tasks();if(page==='library')await library();if(page==='settings'&&!document.querySelector('#settings input:focus'))await loadSettings();if(current&&$('viewer').open){processes=await api('/api/processes?item_id='+current.id);renderProcesses()}}catch(e){notify(t('error')+' '+e.message)}finally{refreshing=false}}
function settings(){let a=$('proxy').value,b=$('profile').value;$('proxy').replaceChildren(opt('',t('pool')),...config.proxies.map(p=>opt(p.id,p.id)));$('proxy').value=a;$('profile').replaceChildren(opt('',t('none')),...config.profiles.map(p=>opt(p.name,p.name)));$('profile').value=b;$('proxies').replaceChildren();for(let p of config.proxies){let row=el('div',undefined,'toolbar');row.append(el('span',p.id,'badge'),button(t('check'),async()=>{let r=await send('/api/proxies/'+p.id+'/check',{});$('proxycheck').textContent=t(r.reachable?'reachable':'unreachable')}),button(t('remove'),async()=>{await send('/api/proxies/'+p.id,undefined,'DELETE');await loadSettings()}));$('proxies').append(row)}if(!config.proxies.length)$('proxies').append(el('p',t('empty'),'muted'));$('capabilities').replaceChildren();let c=config.processing;for(let [label,ok]of[['中文 → English',c.translation['zh-en']],['English → 中文',c.translation['en-zh']],['OCR',c.ocr],[t('transcribe'),c.speech]])$('capabilities').append(el('p',label+' · '+t(ok?'ready':'missing'),ok?'good':''));$('profilesList').replaceChildren();for(let p of config.profiles)$('profilesList').append(el('p',p.name+' · '+t(p.status)+(p.proxy_id?' · '+p.proxy_id:'')));$('used').textContent=size(config.storage_used_bytes)+' / '+config.storage_limit_mb+' MB';$('storageLimit').value=config.storage_limit_mb;$('defaultstrict').checked=config.default_strict}async function loadSettings(){config=await api('/api/settings');settings()}
$('capture').onsubmit=guard(async()=>{if($('network').value==='strict'&&!config.proxies.length)throw Error(t('blocked'));$('submit').disabled=true;try{let spec={urls:$('urls').value.split('\n').map(x=>x.trim()).filter(Boolean),max_depth:+$('depth').value,max_pages:+$('pages').value,max_resources:+$('resources').value,max_total_mb:+$('total').value,max_file_mb:+$('filemax').value,concurrency:+$('concurrency').value,interval_seconds:+$('interval').value,browser:$('browser').checked,media:$('media').checked,gallery:$('gallery').checked,media_quality:$('best').checked?'best':'low',include_assets:$('assets').checked,network_mode:$('network').value,proxy_ids:$('proxy').value?[$('proxy').value]:[],profile:$('profile').value||null,allowed_domains:$('domains').value.split(',').map(x=>x.trim()).filter(Boolean),path_prefix:$('prefix').value||'/',download_selectors:$('selectors').value.split('\n').map(x=>x.trim()).filter(Boolean)};let j=await send('/api/jobs',spec);selected=j.id;nav('tasks');notify(t('submitted'))}finally{$('submit').disabled=false}});for(let a of ['cancel','retry'])$(a).onclick=guard(async()=>{if(selected){let j=await send('/api/jobs/'+selected+'/'+a);selected=j.id;await tasks()}});$('export').onclick=()=>{if(manifest){let u=URL.createObjectURL(new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'})),a=link('',u);a.download='manifest.json';a.click();URL.revokeObjectURL(u)}};$('searchForm').onsubmit=guard(async()=>{offset=0;await library()});$('prev').onclick=guard(async()=>{offset=Math.max(0,offset-50);await library()});$('next').onclick=guard(async()=>{offset+=50;await library()});$('proxyForm').onsubmit=guard(async()=>{await send('/api/proxies',{id:$('proxyid').value,url:$('proxyurl').value});$('proxyurl').value='';await loadSettings();notify(t('success'))});$('settingsForm').onsubmit=guard(async()=>{await send('/api/settings',{default_strict:$('defaultstrict').checked,storage_limit_mb:+$('storageLimit').value},'PATCH');await loadSettings();notify(t('success'))});$('loginForm').onsubmit=guard(async()=>{notify(t('loading'));await send('/api/profiles/login',{name:$('loginname').value,url:$('loginurl').value,network_mode:$('network').value,proxy_ids:$('proxy').value?[$('proxy').value]:[]});notify(t('loginnote'))});$('saveLogin').onclick=guard(async()=>{await send('/api/profiles/'+encodeURIComponent($('loginname').value)+'/save');await loadSettings();notify(t('success'))});$('cancelLogin').onclick=guard(async()=>{await send('/api/profiles/'+encodeURIComponent($('loginname').value)+'/cancel')});
async function show(i){current=i;readData=null;$('filename').textContent=i.filename||i.title||i.url;$('original').href='/api/files/'+i.id;$('original').hidden=!i.downloaded;let url=i.source_pages[0]||i.url;$('source').href=/^https?:/.test(url)?url:'#';$('fileinfo').textContent=size(i.size)+' · '+(i.sha256?i.sha256.slice(0,16):'');$('tags').value=(i.tags||[]).join(', ');$('preview').replaceChildren();let m=i.content_type||'';if(i.downloaded&&/^(image\/(jpeg|png|webp|gif)|video\/mp4|audio\/(mpeg|mp4|wav)|application\/pdf)$/.test(m)){let p=el(m.startsWith('image')?'img':m.startsWith('video')?'video':m.startsWith('audio')?'audio':'iframe');p.src='/api/items/'+i.id+'/preview';if(p.tagName==='IMG')p.alt=i.filename||'';if(['VIDEO','AUDIO'].includes(p.tagName)){p.controls=true;p.preload='metadata'}if(p.tagName==='IFRAME')p.title=i.filename||'PDF';$('preview').append(p)}$('reader').replaceChildren();$('viewer').showModal();processes=await api('/api/processes?item_id='+i.id);renderProcesses();if(i.extracted){let r=await fetch('/api/files/'+i.id+'?text=true');readData={segments:[{text:await r.text()}]};reader()}}
$('closeViewer').onclick=()=>$('viewer').close();$('viewer').addEventListener('close',()=>{$('preview').replaceChildren();current=null});$('tagForm').onsubmit=guard(async()=>{current=await send('/api/items/'+current.id+'/tags',{tags:$('tags').value.split(',')},'PATCH');notify(t('success'));refresh()});
function renderProcesses(){let chosen=$('processSource').value;$('processSource').replaceChildren(opt('',t('rawsource')),...processes.filter(p=>['completed','partial'].includes(p.status)&&p.spec.action!=='translate').map(p=>opt(p.id,t(p.spec.action)+' · '+p.id.slice(0,6))));$('processSource').value=chosen;$('processes').replaceChildren();for(let p of processes){let row=el('div',undefined,'process'),bar=el('div',undefined,'toolbar');bar.append(el('span',t(p.spec.action)+' · '+t(p.status)+' · '+p.progress+'%'));if(p.files&&['completed','partial'].includes(p.status)){bar.append(button(t('output'),async()=>{readData=await api('/api/processes/'+p.id+'/files/json');reader()}));for(let k of Object.keys(p.files))bar.append(link(k==='text'?'Markdown':k==='json'?'JSON':k,'/api/processes/'+p.id+'/files/'+k))}if(['queued','running'].includes(p.status))bar.append(button(t('cancel'),async()=>{await send('/api/processes/'+p.id+'/cancel');refresh()}));else bar.append(button(t('retry'),async()=>{await send('/api/processes/'+p.id+'/retry');refresh()}));row.append(bar);if(p.error)row.append(el('div',p.error,'error'));$('processes').append(row)}}$('runProcess').onclick=guard(async()=>{await send('/api/items/'+current.id+'/process',{action:$('action').value,source_language:$('sourceLang').value,target_language:$('targetLang').value,source_process_id:$('processSource').value||null});await refresh();notify(t('submitted'))});function reader(){$('reader').replaceChildren();if(!readData)return;let mode=$('readmode').value,grid=el('div',undefined,'reader'+(mode==='bilingual'?'':' single'));for(let s of readData.segments){let loc=s.page?t('page')+' '+s.page:s.start!=null?s.start.toFixed(2)+'–'+s.end.toFixed(2)+'s':'';for(let k of mode==='bilingual'?['text','translation']:mode==='original'?['text']:['translation']){let d=el('div');if(loc)d.append(el('small',loc),el('br'));d.append(el('span',s[k]||'—'));grid.append(d)}}$('reader').append(grid)}$('readmode').onchange=reader;
(async()=>{language();await loadSettings();$('network').value=config.default_strict?'strict':'system'})().catch(e=>notify(t('error')+' '+e.message));setInterval(refresh,4000);
</script></body></html>
